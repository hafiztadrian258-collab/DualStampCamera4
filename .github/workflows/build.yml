name: Build DualStampCamera APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Auto-Detect & Build APK
        run: |
          if [ -f "settings.gradle" ]; then
            DIR="."
          elif [ -f "DualStampCamera/settings.gradle" ]; then
            DIR="DualStampCamera"
          else
            DIR="$(dirname "$(find . -name settings.gradle | head -n 1)")"
          fi
          echo "Project dir: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          cd "$DIR"
          gradle --no-daemon assembleDebug

      - name: Build Release APK (kecil, R8)
        continue-on-error: true
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DualStampCamera-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
